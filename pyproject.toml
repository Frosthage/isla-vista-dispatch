[project]
name = "isla-vista-dispatch"
version = "0.1.0"
description = "Scrapes student rentals around UCSB and renders a static site"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "jinja2>=3.1",
    "pillow>=10.0",
]

[project.scripts]
scrape = "scrape.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
